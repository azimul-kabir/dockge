name: Publish Dockge Next image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional additional image tag, for example 2.0.0
        required: false
        type: string
  push:
    branches:
      - dockge-next
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build:frontend

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/azimul-kabir/dockge
            ghcr.io/azimul-kabir/dockge-next
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/dockge-next' || startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=dockge-next,enable=${{ github.ref == 'refs/heads/dockge-next' }}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=Dockge Next
            org.opencontainers.image.description=Dockge Next, a fork of the original Dockge project
            org.opencontainers.image.source=https://github.com/azimul-kabir/dockge
            org.opencontainers.image.authors=Azimul Kabir https://github.com/azimul-kabir

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
